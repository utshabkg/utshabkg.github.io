<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Page not found — Utshab Kumar Ghosh</title>
	<meta name="robots" content="noindex">
	<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
	<script>
		(function () {
			try {
				var t = localStorage.getItem("theme") ||
					(window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
				document.documentElement.dataset.theme = t;
			} catch (e) {
				document.documentElement.dataset.theme = "dark";
			}
		})();
	</script>
	<link rel="stylesheet" href="/css/styles.css">
</head>

<body>
	<main class="section" style="min-height: 70vh; display: grid; place-items: center; text-align: center;">
		<div class="container">
			<p class="hero-eyebrow">404</p>
			<h1>This page doesn’t exist.</h1>
			<p class="section-subtitle">The link may be old — everything lives on the home page now.</p>
			<a class="btn btn-primary" href="/">Back to the portfolio</a>
		</div>
	</main>
</body>

</html>
